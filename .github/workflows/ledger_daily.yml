name: Daily Quarry Ledger

# THE QUARRY LEDGER — Series VIII (JADE)
# Runs the frozen forward test once a day, rebuilds the public site, and
# commits docs/ledger/index.html which GitHub Pages serves at
# /Quarry-Intelligence/ledger/ (same Pages setup as the web/ dashboards).
#
# Idempotent: forward.py continues the ledger from its stored start_date and
# preserves graded results; repeat runs on the same day converge to the same
# state. Models are FROZEN artifacts — this workflow never retrains.
#
# Self-contained: v8_jade/ vendors its v7 feature builder (_v7_features.py) and
# ships its frozen models, so nothing outside v8_jade/ is needed at runtime.

on:
  schedule:
    # Single daily run, 18:30 US/Central. The picks feed ingests with a median
    # ~23h lag (all picks within 48h), so an evening run captures nearly the
    # entire prior-day slate (~29h after close) while a morning run would miss
    # that morning's deliveries and lag ~44h behind.
    - cron: '30 23 * * *'
  workflow_dispatch: {}      # manual run / catch-up (free, on demand)

concurrency:
  group: ledger-daily
  cancel-in-progress: false

jobs:
  ledger:
    name: Forward test + rebuild site + publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: v8_jade/requirements.txt

      - name: Install pinned dependencies
        working-directory: v8_jade
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify frozen artifacts are present
        working-directory: v8_jade
        run: |
          for f in models/jade_all.json models/jade_disc.json models/jade_iso.pkl \
                   models/jade_policy.json; do
            test -s "$f" || { echo "::error::missing frozen artifact $f"; exit 1; }
          done
          echo "Frozen artifacts OK."

      # The forward test needs the pick_sources table, which the anon key cannot
      # read (RLS). Preflight fails loudly rather than letting the model score on
      # degraded features — never publish picks the frozen policy did not choose.
      - name: Preflight Supabase access
        working-directory: v8_jade
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
        run: python3 fetch.py

      - name: Run frozen forward test (fetch -> score -> ledger)
        working-directory: v8_jade
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
        run: python3 forward.py

      - name: Build the public site
        working-directory: v8_jade
        run: python3 build_site.py

      - name: Publish to Pages directory
        run: |
          mkdir -p docs/ledger
          cp v8_jade/site/index.html docs/ledger/index.html
          cp v8_jade/site/ledger_summary.json docs/ledger/ledger_summary.json
          cp v8_jade/FORWARD_LEDGER.md docs/ledger/FORWARD_LEDGER.md
          echo "--- ledger_summary.json ---"
          cat docs/ledger/ledger_summary.json

      # Regenerate Series 7/8 rows in the README from the live ledgers. Our own
      # (jade) ledger must be fresh or this fails; the Ruby row warns and skips
      # if the pipeline's tracker is stale - never silently stale numbers.
      - name: Refresh README metrics
        run: python3 scripts/update_readme_metrics.py --host jade

      - name: Commit ledger + site
        run: |
          git config user.name "quarry-ledger-bot"
          git config user.email "actions@quarry.intelligence"
          git add docs/ledger/ v8_jade/forward_ledger.json v8_jade/FORWARD_LEDGER.md README.md
          if git diff --cached --quiet; then
            echo "Ledger unchanged today."
          else
            git commit -m "ledger: daily update $(date -u +%F) [skip ci]"
            git remote set-url origin "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"
            # Fast path: push directly. Deepen + rebase only if the remote moved.
            if ! git push origin main; then
              echo "⚠️ Non-fast-forward — integrating remote changes (shallow, depth 100)..."
              git fetch origin main --depth 100
              git rebase --autostash origin/main || {
                git rebase --abort; echo "::error::rebase failed; push skipped"; exit 1; }
              git push origin main
            fi
          fi

      # Pages here is an artifact deploy (build_type: workflow), so the ledger
      # publishes from this job instead of waiting on the data pipeline's run.
      # GitHub serialises concurrent deployments via the github-pages environment.
      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
