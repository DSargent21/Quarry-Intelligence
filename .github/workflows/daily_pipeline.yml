# Daily Quarry Pipeline
#
# Single job (billed minutes = one runner's wall time, no duplicated setup).
# Every cache the free plan allows: python venv, models submodule, data lake.
#
# Cost controls:
#   - shallow checkout (repo pack is 1.3GB)
#   - assets (matplotlib plots) regenerate WEEKLY (Monday) or on demand, not daily
#   - data fetch is incremental (their pipeline caches + pulls last 3 days)
#   - concurrency group queues cron + manual runs so they never race the commit

name: Daily Quarry Pipeline

on:
  schedule:
    - cron: '0 9 * * *' # daily 10:00 CET/CEST; Monday runs also rebuild charts
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Bypass data cache and perform FULL refresh from Supabase'
        type: boolean
        default: false
      force_assets:
        description: 'Regenerate all charts/assets this run'
        type: boolean
        default: false

concurrency:
  # Shared with the Daily Ledger workflow: both regenerate README and commit to
  # main, so they must never run their commit/push steps at the same time.
  group: quarry-commit
  cancel-in-progress: false

jobs:
  pipeline:
    name: Quarry Pipeline + Ruby Tracker + Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # shallow: repo pack is 1.3GB, sync deepens on demand
          token: ${{ secrets.GH_PAT }}

      - name: Compute Flags
        id: flags
        run: |
          # Monday (date +%u == 1) => full chart rebuild. Daily runs skip asset
          # regen. Uses date instead of github.event.schedule (deprecated/removed).
          ASSETS="false"
          if [[ "$(date +%u)" == "1" ]] || [[ "${{ github.event.inputs.force_assets }}" == "true" ]]; then
            ASSETS="true"
          fi
          echo "assets=${ASSETS}" >> "$GITHUB_OUTPUT"
          echo "assets=${ASSETS}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Restore Python Venv
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt', 'ruby/requirements.txt') }}

      - name: Create Venv + Install Dependencies
        run: |
          rm -rf .venv
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Models Submodule Commit
        id: models
        run: echo "commit=$(git ls-tree HEAD models | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Restore Models Cache
        id: models-cache
        uses: actions/cache@v4
        with:
          path: models/
          key: ${{ runner.os }}-models-${{ steps.models.outputs.commit }}

      - name: Clean Stale Submodule Marker
        if: steps.models-cache.outputs.cache-hit == 'true'
        run: |
          # A previous run's checkout left a `models/.git` gitdir pointer in the
          # cache. On a fresh checkout the submodule is NOT initialized, so that
          # dangling pointer makes every git command fail with
          # "fatal: not a git repository: models/../.git/modules/models".
          # Removing the marker makes git treat the restored files as the
          # (uninitialized) gitlink and ignore them. Verified: commit stays clean.
          rm -f models/.git

      - name: Sync Submodule (Models)
        if: steps.models-cache.outputs.cache-hit != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # [SECURITY]: in-memory auth injection (no tracked file leakage)
          git config --global url.https://${GH_PAT}@github.com/.insteadOf https://github.com/
          # --depth 1: the submodule only needs the latest model artifacts
          git submodule update --init --recursive --depth 1
          if [ ! -f "models/v4_quartz.pkl" ]; then
            echo "❌ ERROR: Models submodule not populated correctly!"
            ls -R models/
            exit 1
          fi
          echo "✅ Models verified."

      - name: Restore/Clear Data Lake Cache
        if: github.event.inputs.clear_cache != 'true'
        uses: actions/cache@v4
        with:
          path: data/
          # v2 key retires the legacy 2016-seeded lake: the upstream table was
          # re-seeded (now starts 2024-01-01), so restoring the old cache mixed
          # two dataset revisions and collapsed Pyrite's edge signal.
          key: ${{ runner.os }}-quarry-data-v2-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-quarry-data-v2-

      - name: Run Unified Daily Update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ASSETS_ENABLED: ${{ steps.flags.outputs.assets }}
          # Always recompute: the heartbeat guard compares calendar days in ET,
          # so a late-second run would otherwise silently skip and leave every
          # model card frozen at yesterday's numbers.
          FORCE_UPDATE: 'true'
        run: |
          source .venv/bin/activate
          mkdir -p data docs logs
          # Retry the main script (3 attempts, backoff between)
          OK=0
          for i in 1 2 3; do
            set +e
            python3 scripts/daily_update.py 2>&1 | tee pipeline_output.log
            PIPE=${PIPESTATUS[0]}
            set -e
            if [ $PIPE -eq 0 ]; then OK=1; break; fi
            echo "⚠️ Pipeline failed (Attempt $i). Retrying in 60s..."
            sleep 60
          done
          if [ $OK -ne 1 ]; then
            echo "❌ Pipeline failed after 3 attempts."
            exit 1
          fi

      - name: Run Ruby Forward Tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          source .venv/bin/activate
          python3 ruby/forward.py 2>&1 | tee ruby_forward.log

      - name: Verify Tracker Output
        run: |
          source .venv/bin/activate
          python3 - <<'PY'
          import json
          import pathlib
          payload = json.loads(pathlib.Path("docs/ruby_forward.json").read_text())
          assert "stats" in payload and "meta" in payload, "bad payload"
          html = pathlib.Path("docs/web/ruby.html").read_text()
          assert "RUBY_FORWARD" in html, "ruby.html not updated"
          import datetime
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          lu = str(payload["meta"].get("last_update", ""))[:10]
          assert lu == today, f"ruby_forward.json is stale (last_update={lu}, today={today})"
          print(f"OK: start={payload['meta'].get('start_date')} n={payload['stats']['n']} updated={lu}")
          PY

      - name: Generate Executive Job Summary
        if: always()
        run: |
          echo '## 📊 Quarry Pipeline Summary ['$(date +'%Y-%m-%d')']' >> $GITHUB_STEP_SUMMARY
          echo '### 🔍 Critical Logs' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep "❌ CRITICAL" pipeline_output.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No critical errors found." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f docs/pipeline_summary.json ]; then
            RANGE=$(jq -r '.data_range' docs/pipeline_summary.json)
            ROWS=$(jq -r '.total_rows' docs/pipeline_summary.json)
            TIMESTAMP=$(jq -r '.last_update' docs/pipeline_summary.json)
            echo '### 📡 Data Integrity' >> $GITHUB_STEP_SUMMARY
            echo '| Metric | Status |' >> $GITHUB_STEP_SUMMARY
            echo '| :--- | :--- |' >> $GITHUB_STEP_SUMMARY
            echo '| **Last Update** | '$TIMESTAMP' |' >> $GITHUB_STEP_SUMMARY
            echo '| **Date Range** | '$RANGE' |' >> $GITHUB_STEP_SUMMARY
            echo '| **Total Rows Fetched** | '$ROWS' |' >> $GITHUB_STEP_SUMMARY
            echo '### 🤖 Model Identifications' >> $GITHUB_STEP_SUMMARY
            jq -r '.picks_identified | to_entries[] | "| \(.key) | \(.value) |"' docs/pipeline_summary.json >> $GITHUB_STEP_SUMMARY
          else
            echo '⚠️ Pipeline failed to produce a summary. Check logs.' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📦 Archive Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            pipeline_output.log
            ruby_forward.log
            logs/*.log

      - name: 🔬 Verify Model Stats Freshness
        run: |
          source .venv/bin/activate
          python3 - <<'PY'
          import json, pathlib
          from datetime import datetime, timedelta, timezone
          et = datetime.now(timezone.utc) - timedelta(hours=5)
          fresh = {et.strftime('%Y-%m-%d'), (et - timedelta(days=1)).strftime('%Y-%m-%d')}
          payload = json.loads(pathlib.Path('docs/web/stats.json').read_text())
          stamp = str(payload.get('meta', {}).get('last_update', ''))[:10]
          assert stamp in fresh, f'stats.json is stale (last_update={stamp})'
          stale = [
              k for k, v in payload.get('models', {}).items()
              if (v.get('yesterday') or {}).get('date', 'n/a') not in ('n/a', 'N/A')
              and datetime.strptime((v['yesterday']['date']), '%b %d, %Y').strftime('%Y-%m-%d') < (et - timedelta(days=3)).strftime('%Y-%m-%d')
          ]
          print(f'OK: stats.json updated {stamp}; stale model ledgers: {stale or "none"}')
          PY

      - name: 🔬 Deployment Audit
        run: |
          source .venv/bin/activate
          python3 scripts/debug_deployment.py

      - name: 📡 Sync Sentinel (Live Probe)
        run: |
          source .venv/bin/activate
          python3 scripts/sync_sentinel.py

      - name: Git Sync & Commit
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.email bot@quarry.institutional
          git config --global user.name QuarryBot

          # Ensure .nojekyll exists in docs to bypass Jekyll processing
          touch docs/.nojekyll

          # Regenerate Series 7/8 rows in the README from the live ledgers. Our
          # own (ruby) tracker must be fresh or this fails; the Jade row warns
          # and skips if the ledger's summary is stale.
          python3 scripts/update_readme_metrics.py --host ruby

          git add -A
          if [[ -z $(git status --porcelain) ]]; then
            echo 'No changes to commit (Pipeline skipped or no new data).'
            exit 0
          fi
          git commit -m '📈 Auto-Update: Daily Pipeline Sync ['$(date +'%Y-%m-%d')']'
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git
          # Push with up to 3 attempts. On a raced commit, rebase onto the
          # remote favouring OUR side for conflicts (-X theirs): every
          # generated file in this commit was just rebuilt from live data, so
          # the fresh copy is the correct resolution. Abort any half-finished
          # rebase before retrying so the step can never wedge.
          for attempt in 1 2 3; do
            if git push origin main; then break; fi
            if [ $attempt -eq 3 ]; then echo "::error::push failed after 3 attempts"; exit 1; fi
            echo "⚠️ Non-fast-forward (attempt $attempt) — rebasing onto origin/main..."
            git rebase --abort 2>/dev/null || true
            rm -rf .git/rebase-merge .git/rebase-apply 2>/dev/null || true
            git fetch origin main --depth 100
            git rebase --autostash -X theirs origin/main || {
              echo "::error::rebase failed; push skipped"; git rebase --abort 2>/dev/null || true; exit 1; }
          done

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
