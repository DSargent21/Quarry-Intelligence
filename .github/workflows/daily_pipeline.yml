# Daily Quarry Pipeline
#
# Three jobs, kept as fast as possible without breaking the daily sync:
#   ruby-tracker   : scores + grades the frozen V7 Ruby policy, pushes the ledger
#                    and page. Runs in PARALLEL with the main pipeline.
#   quarry-pipeline: main data lake, model simulations, assets, reports.
#   deploy         : waits for both, then publishes docs/ to GitHub Pages.
#
# Concurrency: cron and manual runs never overlap (queued, not cancelled), so
# the auto-commit cannot race itself.

name: Daily Quarry Pipeline

on:
  schedule:
    - cron: '0 9 * * *' # 10:00 AM CET/CEST (European Central Time)
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Bypass data cache and perform FULL refresh from Supabase'
        type: boolean
        default: false

concurrency:
  group: quarry-daily
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- RUBY ----
  ruby-tracker:
    name: Ruby V7 Forward Tracker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # shallow: repo pack is 1.3GB, sync deepens on demand
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Restore Data Lake Cache
        uses: actions/cache@v4
        with:
          path: data/
          key: ${{ runner.os }}-quarry-data-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-quarry-data-

      - name: Install Ruby Dependencies (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install -r ruby/requirements.txt

      - name: Run Forward Tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 ruby/forward.py 2>&1 | tee ruby_forward.log

      - name: Verify Tracker Output
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          payload = json.loads(pathlib.Path("docs/ruby_forward.json").read_text())
          assert "stats" in payload and "meta" in payload, "bad payload"
          html = pathlib.Path("docs/web/ruby.html").read_text()
          assert "RUBY_FORWARD" in html, "ruby.html not updated"
          print(f"OK: start={payload['meta'].get('start_date')} n={payload['stats']['n']}")
          PY

      - name: Git Sync & Commit
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.email bot@quarry.institutional
          git config --global user.name QuarryBot

          git add -A
          if [[ -z $(git status --porcelain) ]]; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "🔴 Ruby Forward Sync [$(date +'%Y-%m-%d')]"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git
          # Fast path: push directly. Deepen + rebase only if the remote moved.
          if ! git push origin main; then
            echo "⚠️ Non-fast-forward — integrating remote changes (shallow, depth 100)..."
            git fetch origin main --depth 100
            git rebase --autostash origin/main || {
              echo "⚠️ Shallow rebase failed — deepening to full history and retrying..."
              git fetch --unshallow
              git rebase --autostash origin/main
            }
            git push origin main
          fi

      - name: 📦 Archive Tracker Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-tracker-logs-${{ github.run_id }}
          path: ruby_forward.log

  # ------------------------------------------------------------- PIPELINE ----
  quarry-pipeline:
    name: Quarry Data Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # shallow: repo pack is 1.3GB, sync deepens on demand
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Sync Submodule (Models)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # [SECURITY]: in-memory auth injection (no tracked file leakage)
          git config --global url.https://${GH_PAT}@github.com/.insteadOf https://github.com/
          # --depth 1: the submodule only needs the latest model artifacts
          git submodule update --init --recursive --depth 1
          if [ ! -f "models/v4_quartz.pkl" ]; then
            echo "❌ ERROR: Models submodule not populated correctly!"
            ls -R models/
            exit 1
          fi
          echo "✅ Models verified."

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore/Clear Data Lake Cache
        if: github.event.inputs.clear_cache != 'true'
        uses: actions/cache@v4
        with:
          path: data/
          key: ${{ runner.os }}-quarry-data-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-quarry-data-

      - name: Run Unified Daily Update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p data docs logs
          # Add retry for the main script
          for i in {1..3}; do
            python3 scripts/daily_update.py 2>&1 | tee pipeline_output.log && break || {
              if [ $i -lt 3 ]; then
                echo "⚠️ Pipeline failed (Attempt $i). Retrying in 60s..."
                sleep 60
              else
                echo "❌ Pipeline failed after 3 attempts."
                exit 1
              fi
            }
          done

      - name: 📦 Archive Pipeline Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            pipeline_output.log
            logs/*.log

      - name: Generate Executive Job Summary
        if: always()
        run: |
          echo '## 📊 Quarry Pipeline Summary ['$(date +'%Y-%m-%d')']' >> $GITHUB_STEP_SUMMARY
          echo '### 🔍 Critical Logs' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep "❌ CRITICAL" pipeline_output.log >> $GITHUB_STEP_SUMMARY || echo "No critical errors found." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [ -f docs/pipeline_summary.json ]; then
            RANGE=$(jq -r '.data_range' docs/pipeline_summary.json)
            ROWS=$(jq -r '.total_rows' docs/pipeline_summary.json)
            TIMESTAMP=$(jq -r '.last_update' docs/pipeline_summary.json)
            echo '### 📡 Data Integrity' >> $GITHUB_STEP_SUMMARY
            echo '| Metric | Status |' >> $GITHUB_STEP_SUMMARY
            echo '| :--- | :--- |' >> $GITHUB_STEP_SUMMARY
            echo '| **Last Update** | '$TIMESTAMP' |' >> $GITHUB_STEP_SUMMARY
            echo '| **Date Range** | '$RANGE' |' >> $GITHUB_STEP_SUMMARY
            echo '| **Total Rows Fetched** | '$ROWS' |' >> $GITHUB_STEP_SUMMARY
            echo '### 🤖 Model Identifications' >> $GITHUB_STEP_SUMMARY
            jq -r '.picks_identified | to_entries[] | "| \(.key) | \(.value) |"' docs/pipeline_summary.json >> $GITHUB_STEP_SUMMARY
          else
            echo '⚠️ Pipeline failed to produce a summary. Check logs.' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔬 Comprehensive Deployment Audit
        run: |
          python3 scripts/debug_deployment.py

      - name: 📡 Sync Sentinel (Live Probe)
        run: |
          python3 scripts/sync_sentinel.py

      - name: 🛡️ Git Sync & Commit
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.email bot@quarry.institutional
          git config --global user.name QuarryBot

          # Ensure .nojekyll exists in docs to bypass Jekyll processing
          touch docs/.nojekyll

          git add -A
          if [[ -z $(git status --porcelain) ]]; then
            echo 'No changes to commit (Pipeline skipped or no new data).'
            exit 0
          fi
          git commit -m '📈 Auto-Update: Daily Pipeline Sync ['$(date +'%Y-%m-%d')']'
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git
          # Fast path: push directly. Deepen + rebase only if the remote moved.
          if ! git push origin main; then
            echo "⚠️ Non-fast-forward — integrating remote changes (shallow, depth 100)..."
            git fetch origin main --depth 100
            git rebase --autostash origin/main || {
              echo "⚠️ Shallow rebase failed — deepening to full history and retrying..."
              git fetch --unshallow
              git rebase --autostash origin/main
            }
            git push origin main
          fi

  # ---------------------------------------------------------------- DEPLOY ----
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quarry-pipeline, ruby-tracker]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure .nojekyll
        run: touch docs/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
