name: Daily Quarry Pipeline

on:
  schedule:
    - cron: '0 9 * * *' # 10:00 AM CET/CEST (European Central Time)
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Bypass data cache and perform FULL refresh from Supabase'
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # [BILLION DOLLAR SCALING]: Increased for large data fetches
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Sync Submodule (Models)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # [BILLION DOLLAR SECURITY]: In-memory auth injection (No tracked file leakage)
          git config --global url.https://${GH_PAT}@github.com/.insteadOf https://github.com/
          git submodule update --init --recursive

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore/Clear Data Lake Cache
        if: github.event.inputs.clear_cache != 'true'
        uses: actions/cache@v4
        with:
          path: data/
          key: ${{ runner.os }}-quarry-data-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-quarry-data-

      - name: Run Unified Daily Update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p data docs logs
          # Add retry for the main script
          for i in {1..3}; do
            python3 scripts/daily_update.py 2>&1 | tee pipeline_output.log && break || {
              if [ $i -lt 3 ]; then
                echo "⚠️ Pipeline failed (Attempt $i). Retrying in 60s..."
                sleep 60
              else
                echo "❌ Pipeline failed after 3 attempts."
                exit 1
              fi
            }
          done

      - name: 📦 Archive Pipeline Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            pipeline_output.log
            logs/*.log

      - name: Generate Executive Job Summary
        if: always()
        run: |
          echo '## 📊 Quarry Pipeline Summary ['$(date +'%Y-%m-%d')']' >> $GITHUB_STEP_SUMMARY

          if [ -f docs/pipeline_summary.json ]; then
            # Parse metrics from the JSON produced by the script
            RANGE=$(jq -r '.data_range' docs/pipeline_summary.json)
            ROWS=$(jq -r '.total_rows' docs/pipeline_summary.json)
            TIMESTAMP=$(jq -r '.last_update' docs/pipeline_summary.json)

            echo '### 📡 Data Integrity' >> $GITHUB_STEP_SUMMARY
            echo '| Metric | Status |' >> $GITHUB_STEP_SUMMARY
            echo '| :--- | :--- |' >> $GITHUB_STEP_SUMMARY
            echo '| **Last Update** | '$TIMESTAMP' |' >> $GITHUB_STEP_SUMMARY
            echo '| **Date Range** | '$RANGE' |' >> $GITHUB_STEP_SUMMARY
            echo '| **Total Rows Fetched** | '$ROWS' |' >> $GITHUB_STEP_SUMMARY

            echo '### 🤖 Model Identifications' >> $GITHUB_STEP_SUMMARY
            echo '| Model | Picks Found |' >> $GITHUB_STEP_SUMMARY
            echo '| :--- | :--- |' >> $GITHUB_STEP_SUMMARY
            jq -r '.picks_identified | to_entries[] | "| \(.key) | \(.value) |"' docs/pipeline_summary.json >> $GITHUB_STEP_SUMMARY
          else
            echo '⚠️ Pipeline failed to produce a summary. Check logs.' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🛡️ Indestructible Git Sync & Deploy
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # 1. Institutional Commit Logic
          git config --global user.email bot@quarry.institutional
          git config --global user.name QuarryBot

          git add -A

          if [[ -z $(git status --porcelain) ]]; then
            echo 'No changes to commit (Pipeline skipped or no new data).'
          else
            git commit -m '📈 Auto-Update: Daily Pipeline Sync ['$(date +'%Y-%m-%d')'] [skip ci]'

            # [BILLION DOLLAR SYNC]: Rebase with autostash handles concurrent manual pushes
            # We use the PAT-authenticated remote to ensure the push triggers 'Deploy Website'
            git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: 🚀 Atomic Website Deploy
        if: success() || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: success() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        if: success() || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4