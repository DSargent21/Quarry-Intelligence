name: Daily Quarry Pipeline

on:
  schedule:
    - cron: '0 9 * * *' # 9:00 AM UTC daily
  workflow_dispatch:
    inputs:
      full_run:
        description: 'Run full historical simulation'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [trigger-pipeline] # 👈 Best Practice: Allows Scrapper to trigger this via API

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          submodules: false # 👈 We handle this manually to prevent auth overrides
          fetch-depth: 0

      - name: Submodule Force-Auth
        run: |
          git submodule set-url models https://x-access-token:${{ secrets.GH_PAT }}@github.com/Ducky705/XGBoost-Sniper-Models.git
          git submodule sync
          git submodule update --init --recursive
          echo "✅ Submodules force-authenticated and updated."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 👈 Billion Dollar Tip: Caches pip dependencies automatically

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libpng-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Data Lake
        uses: actions/cache@v4
        with:
          path: data/
          # 👈 Best Practice: Key includes Run ID to ensure updated parquet is ALWAYS saved back
          key: ${{ runner.os }}-quarry-data-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-quarry-data-

      - name: Run Unified Daily Update
        id: run_pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Run the update and capture output for summary
          python3 scripts/daily_update.py | tee pipeline_output.log
          
          # Generate a beautiful Job Summary for the GitHub UI
          echo "## 📊 Quarry Pipeline Summary [$(date +'%Y-%m-%d')]" >> $GITHUB_STEP_SUMMARY
          echo "### Model Identifications" >> $GITHUB_STEP_SUMMARY
          grep "picks identified" pipeline_output.log | sed 's/^/ - /' >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Status: NOMINAL**" >> $GITHUB_STEP_SUMMARY

      - name: Commit and Push Changes
        run: |
          git config --global user.name "QuarryBot"
          git config --global user.email "bot@quarry.institutional"
          
          # [BILLION DOLLAR BEST PRACTICE]
          # Stage EVERYTHING that changed (docs, assets, reports)
          # git add -A ensures we don't miss new files or deletions
          git add -A
          
          if [[ -z $(git status -s) ]]; then
            echo "No changes to commit."
          else
            git commit -m "📈 Auto-Update: Daily Pipeline Sync [$(date +'%Y-%m-%d')]"

            # [BILLION DOLLAR BEST PRACTICE]
            # Use GH_PAT to ensure this push triggers the 'Deploy Website' workflow
            git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git

            # [BILLION DOLLAR BEST PRACTICE]
            # --autostash: Handles unstaged changes gracefully
            # --rebase: Keeps history clean and handles race conditions with manual pushes
            git pull --rebase --autostash origin main
            
            git push
          fi


